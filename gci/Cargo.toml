[package]
name = "gci"
version = "0.1.0"
edition = "2024"

[lib]
name = "gci"
path = "src/lib.rs"

[[bin]]
name = "gci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "5"
rpassword = "7"

[dev-dependencies]
mockito = "1"
tempfile = "3"
serial_test = "3"
